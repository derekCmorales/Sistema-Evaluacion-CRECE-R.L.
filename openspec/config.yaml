schema: spec-driven

context: |
  Proyecto: Sistema Evaluación CRECE R.L. — Cooperativa CRECE Guatemala, R.L.
  Repo greenfield (pnpm monorepo). NO copiar código del MVP local CRECE-MVP.

  Stack:
  - apps/web: Next.js 16, React 19, TypeScript 5.9, Tailwind 4, ESLint 9.39
  - apps/api: NestJS 12, TypeScript 5.9, build vía tsc (capas domain / application / infrastructure)
  - packages/shared: tipos mínimos (@crece/shared)
  - pnpm 12.5.1, Node >= 22 (Docker node:24-alpine)
  - PostgreSQL 17 vía Docker Compose
  - Peers y restricciones: docs/stack.md

  Dominio:
  - Captación y evaluación de crédito; persona central (Person); operaciones N.
  - Tres folders: identidad (post-aprobación), operación, custodia legal.
  - Autorización configurable: bajo umbral ref. Q100k → BRANCH_HEAD + DELEGATED_AUTHORIZER (distintos; preparador ≠ delegado);
    en/ sobre umbral → Consejo con quórum. Outcomes: APPROVE, APPROVE_WITH_CHANGES, REJECT, RETURN + DecisionLog.
  - Sin credit score; IA solo asiste (puertos LlmAssistant, OcrProvider) — no implementados en bootstrap.
  - Cálculos financieros determinísticos; reglas duras configurables; config versionada en DB (futuro).

  Convenciones:
  - Interfaces de puertos SIN prefijo I (Clean Code).
  - UI labels es-GT; código en inglés técnico.
  - OpenSpec: propose → apply → archive/sync. Ramas + PR a main.
  - Documentación en español en docs/, AGENTS.md, README.md.

  Diagramas de diseño: docs/diagramas/ (Documento 1).

rules:
  proposal:
    - Incluir sección "No objetivos" y límites de IA (asistencia, no decisión).
    - Referenciar capa domain/application/infrastructure para cambios de API.
  tasks:
    - Tareas acotadas; indicar app (web/api/shared) y si requiere migración DB.
  spec:
    - Ubiquitous language alineado a docs/glosario.md.

operations:
  apply:
    guidance:
      - Respetar dependency rule; no importar infra desde domain.
      - Verificar pnpm build antes de cerrar tareas de infra.
  archive:
    guidance:
      - Actualizar docs/ si el cambio altera autorización, stack o compose.
