name: crece-eval

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crece}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-dev}
      POSTGRES_DB: ${POSTGRES_DB:-crece_eval}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - crece_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-crece} -d ${POSTGRES_DB:-crece_eval}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    profiles: ["dev", "full"]
    env_file:
      - path: .env
        required: false
    environment:
      API_PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgresql://crece:change-me-in-dev@db:5432/crece_eval}
      NODE_ENV: development
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3001/health | grep -q '\"status\":\"ok\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    profiles: ["dev", "full"]
    env_file:
      - path: .env
        required: false
    environment:
      WEB_PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/ | grep -q 'CRECE'",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 45s

volumes:
  crece_pg_data:
